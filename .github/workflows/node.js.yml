# Runs format check, lint, build, and the full test suite (incl. BIP327 vectors
# and the bundled adapter) on every push to master and every PR targeting master.
# See: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel superseded runs on the same ref (e.g. quick successive pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast feedback: format + lint on the sources only (no build/tests).
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
      - run: npm ci
      - run: npm run prettier -- --check
      - run: npm run lint

  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Active LTS / current. Older versions are EOL and can't run the toolchain.
        node-version: [18.x, 20.x, 22.x]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      # `npm test` = prettier --check && tslint && tsc build && jest --coverage.
      # The suite runs every test against the noble, tiny, and bundled-adapter
      # backends, including the BIP327 spec vectors and the adversarial tests.
      - run: npm test
